<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Study Center</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f6f3; --text: #1d1c1a; --muted: #6b6a66; --accent: #3b5bdb; --bad: #c92a2a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d1c1a; --text: #ecebe8; --muted: #9a9893; --accent: #8ea6ff; --bad: #ff8787; } }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; max-width: 460px; padding: 24px; }
    .mark { color: var(--accent); font-size: 40px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    h1 { font-size: 20px; margin: 12px 0 4px; }
    p { color: var(--muted); margin: 4px 0; }
    #error { color: var(--bad); display: none; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">◆</div>
    <h1>Deep Study Center</h1>
    <p id="status">Starting…</p>
    <p id="error"></p>
  </div>
  <script>
    // The desktop shell calls this when the backend did not start.
    window.showError = (msg) => {
      document.getElementById('status').textContent = 'The app could not start.'
      const e = document.getElementById('error'); e.textContent = msg; e.style.display = 'block'
      document.querySelector('.mark').style.animation = 'none'
    }
  </script>
</body>
</html>
