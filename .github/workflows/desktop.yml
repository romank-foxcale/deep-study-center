# The desktop app for Windows, macOS and Linux (docs/RELEASING.md).
# - A pull request that changes desktop/: an unsigned test build on each system; the files are workflow artifacts.
# - A tag v<version>: signed builds, uploaded to a draft GitHub release with one latest.json for all systems.
#   Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the updater key, ~/.tauri/dsc-updater.key).
name: Desktop

on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-14, name: macos-apple-silicon }
          - { os: macos-15-intel, name: macos-intel }
          - { os: ubuntu-22.04, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Linux packages for the window (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf file
      - name: Backend, UI and the bundled backend
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q -e "backend[dev]"
          npm ci --prefix web
          npm ci --prefix desktop
          npm --prefix desktop run build:ui
          npm --prefix desktop run build:backend

      - name: Test build (unsigned)
        if: github.event_name != 'push'
        working-directory: desktop
        run: npx tauri build --config src-tauri/tauri.unsigned.conf.json
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: deep-study-center-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7

      - name: Signed build to the draft release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: Deep Study Center __VERSION__
          releaseBody: See the release notes.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  notes:
    # The release text comes from docs/release-notes-<version>.md. The release stays a draft: check it, then publish.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/release-notes-${tag#v}.md"
          if [ -f "$notes" ]; then gh release edit "$tag" --notes-file "$notes"; fi
