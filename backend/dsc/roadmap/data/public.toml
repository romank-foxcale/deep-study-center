# Public output setup. Weekly posts are generated by the planner (see [posts] in your config);
# these units set up where the posts and projects live.

[track]
id = "public"
title = "Public output"

[[unit]]
id = "pub-blog"
title = "Set up your blog"
minutes = 60
goal = "Have one place where every weekly post goes, under your own name."
resources = ["github-pages", "hf-blog-community", "karpathy-blog"]
exercise = "Choose one platform (a GitHub Pages blog, Hugging Face community articles, or another you will keep). Publish an 'about' page: who you are, what you study, what you will post about."
done_when = "The about page is live at a public URL, and you saved the URL in your config notes."

[[unit]]
id = "pub-profile"
title = "Make your GitHub profile a portfolio"
minutes = 45
requires = ["pub-blog"]
goal = "Make a visitor understand in 30 seconds what you do and where to look."
resources = ["profile-readme"]
exercise = "Write a profile README: one line on your focus (ML for Earth and climate, LLM agent collaboration), links to the blog, and pin the repos you will build in this roadmap."
done_when = "The profile README is live and links to your blog."

[[unit]]
id = "pub-first-post"
title = "First post: why and what you are learning"
minutes = 60
requires = ["pub-blog"]
goal = "Start in public: say what you will learn and why, so people can follow."
resources = ["karpathy-blog"]
exercise = "Write 500-800 words: your background, your two niches, your plan for the next months, and how readers can follow. Share it in one community."
done_when = "The post is published and shared once."
