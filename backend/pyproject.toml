[project]
name = "deep-study-center"
version = "0.5.0"
license = {text = "MIT"}  # table form: works with setuptools 68+ (see LICENSE)
description = "Backend for Deep Study Center: engine, workspace store, agent-CLI providers, API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "fsrs==5.1.3",
  "genanki==0.13.1",
  "pypdf==6.10.2",
  "anthropic==2.12.0",
  "keyring==25.7.0",
  "faster-whisper==1.2.1",  # local dictation (SPEC §27)
  "av==15.1.0",             # audio decoding for faster-whisper; av 16+ breaks faster-whisper 1.2.1
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1", "pyinstaller==6.22.3"]

[project.scripts]
dsc = "dsc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dsc*"]

[tool.setuptools.package-data]
dsc = ["seed/*.json", "prompts/*.md", "roadmap/*.toml", "roadmap/data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
